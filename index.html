          title: `${model.name} — Presentationsfilm`,
          subtitle: model.secondaryShowreelVideoUrl ? 'Officiell Presentation' : 'Modellens Huvudvideo',
          videoUrl: model.showreelVideoUrl
        });
      }

      // Presentationsfilm 2 (Vit Klänning / Showcase) som Slide 2
      if (model.secondaryShowreelVideoUrl) {
        s.push({
          type: 'SHOWREEL',

          title: `${model.name} — Presentationsfilm 2`,

        type: 'HERO',
        id: 'hero',

        image: model.themeImageUrl,
        logo: model.logoUrl
      });

      (model.professions || []).forEach((p, pIdx) => {
        s.push({
          type: 'TITLE',
          id: `title-${p.id}`,
          title: p.title,
          desc: p.description,
          history: p.history,
          chapter: `0${pIdx + 1}`
        });

        if (p.presentationVideoUrl) {
          s.push({
            type: 'VIDEO',
            id: `video-${p.id}`,
            title: `${p.title} — Videopresentation`,
            subtitle: p.description,
            videoUrl: p.presentationVideoUrl,
            ctx: p.title
          });
        }

        (p.media || []).forEach((m, mIdx) => {
          s.push({
            type: 'IMAGE',
            id: `media-${p.id}-${mIdx}-${m.id}`,
            url: m.url,
            caption: m.caption,
            ctx: p.title,
            indexNumber: `0${pIdx + 1}.${mIdx + 1}`
          });
        });
      });

      return s;
    }

    // --- FULLSCREEN KEYNOTE PRESENTATION ---
    function KeynotePresentation({ model, initialSlide = 0, onClose }) {
      const slides = useMemo(() => buildModelSlides(model), [model]);
      const [current, setCurrent] = useState(initialSlide);
      const [isPlaying, setIsPlaying] = useState(true);
      const [progress, setProgress] = useState(0);

      useEffect(() => {
        if (!isPlaying || slides.length <= 1) {
          setProgress(0);
          return;
        }
        const intervalTime = 50;
        const totalDuration = 5000;
        const step = (intervalTime / totalDuration) * 100;

        const timer = setInterval(() => {
          setProgress(p => {
            if (p >= 100) {
              setCurrent(c => (c + 1) % slides.length);
              return 0;
            }
            return p + step;
          });
        }, intervalTime);

        return () => clearInterval(timer);
      }, [isPlaying, slides.length, current]);

      const handleNext = (e) => {
        if (e) e.stopPropagation();
        setCurrent(c => (c + 1) % slides.length);
        setProgress(0);
      };

      const handlePrev = (e) => {
        if (e) e.stopPropagation();
        setCurrent(c => (c - 1 + slides.length) % slides.length);
        setProgress(0);
      };

      const handleRestart = (e) => {
        if (e) e.stopPropagation();
        setCurrent(0);
        setProgress(0);
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight' || e.key === ' ') {
            handleNext();
          } else if (e.key === 'ArrowLeft') {
            handlePrev();
          } else if (e.key === 'Escape') {
            onClose();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [slides.length, onClose]);

      const slide = slides[current] || slides[0];

      return (
        <div className="fixed inset-0 z-[100] bg-[#050505] text-white flex items-center justify-center overflow-hidden select-none">
          {/* 5-second progress bar */}
          <div className="absolute top-0 left-0 right-0 h-1.5 bg-white/10 z-50 overflow-hidden">
            <div 
              className="h-full transition-all duration-75"
              style={{ 
                width: `${isPlaying ? progress : 0}%`, 
                backgroundColor: model.themeColor || '#fbbf24',
                boxShadow: `0 0 15px ${model.themeColor || '#fbbf24'}`
              }} 
            />
          </div>

          {/* Top Bar */}
          <div className="absolute top-4 left-4 right-4 md:top-6 md:left-8 md:right-8 z-50 flex items-center justify-between pointer-events-none">
            <div className="flex items-center gap-3 bg-black/70 backdrop-blur-xl px-4 py-2 rounded-2xl border border-white/10 pointer-events-auto">
              <img src={model.logoUrl} className="w-6 h-6 object-contain" alt={model.name} />
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-black uppercase tracking-tight text-white">{model.name}</span>
                  <span className="text-[10px] font-black uppercase tracking-widest px-2 py-0.5 rounded-lg bg-white/10" style={{ color: model.themeColor || '#fbbf24' }}>
                    Keynote
                  </span>
                </div>
                <span className="text-[9px] font-semibold text-slate-400 block">
                  Slide {current + 1} av {slides.length}
                </span>
              </div>
            </div>

            <div className="flex items-center gap-3 pointer-events-auto">
              <button 
                onClick={onClose} 
                className="flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-red-950/70 border border-red-500/60 hover:bg-red-900 text-red-200 hover:text-white transition-all shadow-[0_0_25px_rgba(239,68,68,0.3)] font-black text-[11px] uppercase tracking-widest cursor-pointer"
                title="Stäng / Avbryt Keynote (ESC)"
              >
                <Icon name="x" className="w-4 h-4 text-red-400" />
                <span>Stäng / Avbryt (ESC)</span>
              </button>
            </div>
          </div>

          {/* Slide Viewport */}
          <div onClick={handleNext} className="absolute inset-0 flex items-center justify-center cursor-pointer">
            {slide.type === 'HERO' && (
              <div className="relative w-full h-full flex flex-col items-center justify-center text-center p-8 md:p-16">
                <img src={slide.image} className="absolute inset-0 w-full h-full object-cover opacity-25 mix-blend-luminosity filter blur-[2px]" />
                <div className="absolute inset-0 bg-gradient-to-t from-[#050505] via-[#050505]/80 to-transparent" />
                <img src={slide.logo} className="w-48 h-48 md:w-72 md:h-72 object-contain mb-8 z-10 drop-shadow-[0_0_50px_rgba(0,0,0,0.9)] opacity-95" />
                <h1 className="text-4xl md:text-8xl font-black italic uppercase tracking-tighter z-10 mb-4 drop-shadow-2xl" style={{ color: model.themeColor || '#fbbf24' }}>
                  {slide.title}
                </h1>
                <p className="text-xl md:text-3xl font-black tracking-widest uppercase text-slate-200 z-10 mb-6 drop-shadow-lg">{slide.subtitle}</p>
                <p className="text-sm md:text-lg max-w-3xl text-slate-400 italic z-10 font-medium leading-relaxed drop-shadow-md">"{slide.definition}"</p>
              </div>

            {slide.type === 'SHOWREEL' && (
              <div className="relative w-full h-full flex flex-col items-center justify-center p-6 md:p-12">
                <div className="relative w-full max-w-5xl aspect-video rounded-[3rem] overflow-hidden border border-white/20 shadow-[0_0_80px_rgba(0,0,0,0.9)] bg-black z-10">
                  <video src={slide.videoUrl} autoPlay loop muted playsInline className="w-full h-full object-cover" />
                </div>
                <div className="mt-6 z-20 text-center">
                  <h2 className="text-2xl md:text-4xl font-black italic uppercase tracking-tight text-white drop-shadow-md">{slide.title}</h2>

            {slide.type === 'TITLE' && (

                  <p className="text-xl md:text-3xl font-medium leading-relaxed text-slate-300 italic drop-shadow-lg mb-8">"{slide.desc}"</p>
                  {slide.history && (
                    <p className="text-sm md:text-base text-slate-400 max-w-2xl mx-auto leading-relaxed border-t border-white/10 pt-6">
                      {slide.history}
                    </p>
                  )}
                </div>
              </div>
            )}

            {slide.type === 'VIDEO' && (
              <div className="relative w-full h-full flex flex-col items-center justify-center p-6 md:p-12">
                <div className="relative w-full max-w-5xl aspect-video rounded-[3rem] overflow-hidden border border-white/20 shadow-[0_0_80px_rgba(0,0,0,0.9)] bg-black z-10">
                  <video src={slide.videoUrl} autoPlay loop muted playsInline className="w-full h-full object-cover" />
                </div>
                <div className="mt-6 z-20 text-center">
                  <h2 className="text-2xl md:text-4xl font-black italic uppercase tracking-tight text-white drop-shadow-md">{slide.title}</h2>
                  <span className="text-xs font-black uppercase tracking-widest" style={{ color: model.themeColor || '#fbbf24' }}>{slide.ctx}</span>
                </div>
              </div>
            )}

            {slide.type === 'IMAGE' && (
              <div className="relative w-full h-full flex items-center justify-center p-6 md:p-12 bg-[#050505]">
                <img src={slide.url} className="max-w-full max-h-full object-contain drop-shadow-[0_0_120px_rgba(0,0,0,0.9)] z-10 rounded-2xl" />
                <div className="absolute bottom-24 md:bottom-28 left-6 md:left-12 bg-black/75 backdrop-blur-2xl px-6 py-4 rounded-[2rem] border border-white/15 z-20 shadow-2xl">

                  </span>
                </div>
              </div>
            )}
          </div>

          {/* Slide Navigation Dots */}
          <div className="absolute bottom-20 left-1/2 -translate-x-1/2 flex gap-1.5 z-40 max-w-[80vw] overflow-hidden py-1">
            {slides.map((_, i) => (
              <button 
                key={i} 
                onClick={(e) => { e.stopPropagation(); setCurrent(i); setProgress(0); }}
                className={`h-1.5 rounded-full transition-all duration-500 cursor-pointer ${i === current ? 'w-8 bg-white' : 'w-2 bg-white/25 hover:bg-white/50'}`} 
                style={i === current ? { backgroundColor: model.themeColor || '#fbbf24', boxShadow: `0 0 10px ${model.themeColor || '#fbbf24'}` } : {}} 
                title={`Hoppa till slide ${i + 1}`}
              />

          </div>

          {/* Bottom Controls */}
          <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-black/85 backdrop-blur-2xl px-4 py-2.5 rounded-full border border-white/15 shadow-[0_10px_40px_rgba(0,0,0,0.8)]">
            <button onClick={handlePrev} className="w-10 h-10 rounded-full bg-white/5 hover:bg-white/20 flex items-center justify-center transition-colors text-white cursor-pointer" title="Föregående">
              <Icon name="chevronLeft" className="w-5 h-5" />

            <button onClick={(e) => { e.stopPropagation(); setIsPlaying(p => !p); }} className="px-4 h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center gap-2 transition-colors text-white font-black text-[10px] uppercase tracking-widest cursor-pointer">
              <Icon name={isPlaying ? "pause" : "play"} className="w-4 h-4" style={{ color: model.themeColor || '#fbbf24' }} />

    // --- MAIN REACT APPLICATION ---
    function App() {
      // Always initialize directly from the exported data
      const [agency, setAgency] = useState(INITIAL_AGENCY);

      const [activeModel, setActiveModel] = useState(() => agency.models[0] || null);
      const [activeTab, setActiveTab] = useState('AGENCY');
      const [lightboxImage, setLightboxImage] = useState(null);
      const [showKeynote, setShowKeynote] = useState(false);
      const [keynoteStartSlide, setKeynoteStartSlide] = useState(0);
      const [showCompanyCollage, setShowCompanyCollage] = useState(false);

      useEffect(() => {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      }, [activeTab, activeModel?.id]);

      const currentThemeColor = activeTab === 'COLLAGE' && activeModel ? (activeModel.themeColor || '#fbbf24') : '#fbbf24';

      const themeStyles = {
        '--theme-color': currentThemeColor,
        '--theme-color-transparent': `${currentThemeColor}33`,
        '--theme-color-glow': `${currentThemeColor}80`,
      };

      const allCompanyMedia = useMemo(() => {
        const list = [];
        if (agency.logoUrl) list.push({ id: 'comp-logo', type: 'image', url: agency.logoUrl, caption: `${agency.name} — Officiell Logotyp` });
        if (agency.media) list.push(...agency.media);
        return list;
      }, [agency]);

      if (showKeynote && activeModel) {
        return <KeynotePresentation model={activeModel} initialSlide={keynoteStartSlide} onClose={() => setShowKeynote(false)} />;
      }

      return (
        <div style={themeStyles} className="min-h-screen bg-[#07080a] text-slate-100 font-sans selection:bg-[var(--theme-color)] selection:text-[#050505]">
          {/* Metallic Svart Bakgrund med svagt vitt ljus (Metallic sheen & soft white ambient light) */}
          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden no-print">
            {/* Metallic black deep base */}
            <div className="absolute inset-0 bg-[#07080a]" />
            {/* Subtle metallic gradient finish */}
            <div className="absolute inset-0 bg-gradient-to-b from-[#181a22]/70 via-[#0a0b0e] to-[#040507]" />
            {/* Soft white spotlights / metallic reflections */}
            <div className="absolute top-[-15%] left-1/2 -translate-x-1/2 w-[1100px] h-[550px] rounded-full bg-gradient-to-b from-white/[0.08] via-slate-300/[0.02] to-transparent blur-[140px]" />
            <div className="absolute top-[35%] left-[-10%] w-[650px] h-[650px] rounded-full bg-white/[0.035] blur-[150px]" />
            <div className="absolute bottom-[-10%] right-[-10%] w-[750px] h-[750px] rounded-full bg-slate-200/[0.03] blur-[160px]" />
            {/* Subtle metallic micro-grid texture */}
            <div className="absolute inset-0 bg-[radial-gradient(#ffffff0a_1px,transparent_1px)] [background-size:28px_28px] opacity-30" />
          </div>

          <div className="relative z-10 flex flex-col min-h-screen">
            {/* Header */}
            <header className="sticky top-0 bg-[#0a0b0e]/90 backdrop-blur-md border-b border-[#1f222a] px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4 z-40 shadow-2xl no-print">
              <div className="flex items-center gap-4 cursor-pointer" onClick={() => setActiveTab('AGENCY')}>
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#1a1c23] to-[#0a0b0e] border border-[#2a2d35] flex items-center justify-center shadow-lg" style={{ borderColor: 'var(--theme-color-transparent)' }}>
                  <Icon name="fingerprint" className="w-6 h-6" style={{ color: 'var(--theme-color)' }} />
                </div>
                <div>
                  <h1 className="text-2xl font-black uppercase italic tracking-tighter bg-clip-text text-transparent bg-gradient-to-b from-white via-gray-300 to-gray-600 leading-none">
                    DNA Vault
                  </h1>
                  <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">
                    {agency.name} // Master Archive
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <div className="flex items-center gap-1.5 p-1 bg-[#0a0b0e] rounded-2xl border border-[#1f222a] shadow-inner">
                  <button 
                    onClick={() => setActiveTab('AGENCY')}
                    className={`px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all flex items-center gap-2 ${activeTab === 'AGENCY' ? 'bg-[#1a1c23] border border-[#3a3f4b] text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'}`}
                    style={activeTab === 'AGENCY' ? { color: 'var(--theme-color)' } : {}}
                  >
                    <Icon name="database" className="w-4 h-4" />
                    Agentur & Index
                  </button>
                  <button 
                    disabled={!activeModel}
                    onClick={() => setActiveTab('COLLAGE')}
                    className={`px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all flex items-center gap-2 ${activeTab === 'COLLAGE' ? 'bg-[#1a1c23] border border-[#3a3f4b] text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'}`}
                    style={activeTab === 'COLLAGE' ? { color: 'var(--theme-color)' } : {}}
                  >
                    <Icon name="layers" className="w-4 h-4" />
                    Modell Kollage
                  </button>
                </div>

                <button onClick={() => window.print()} className="flex items-center gap-2 px-4 py-3 rounded-2xl bg-[#14161d] border border-[#2a2d35] hover:border-[var(--theme-color)] text-slate-300 hover:text-white transition-all text-[10px] font-black uppercase tracking-widest">
                  <Icon name="printer" className="w-4 h-4" />
                  <span>PDF</span>
                </button>
              </div>
            </header>

            {/* Content */}
            <main className="flex-1 p-4 md:p-8 max-w-[1600px] w-full mx-auto">
              {activeTab === 'AGENCY' && (
                <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 pb-20">
                  {/* Left Column: Agency Info */}
                  <div className="xl:col-span-4 flex flex-col gap-6 xl:sticky xl:top-8 h-fit">
                    <div className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] p-8 rounded-[3rem] border border-[#2a2d35] shadow-[0_20px_40px_rgba(0,0,0,0.6)] relative overflow-hidden">
                      <div className="flex items-center justify-between mb-8">
                        <div className="flex items-center gap-3">
                          <div className="w-2 h-2 rounded-full animate-pulse" style={{ backgroundColor: 'var(--theme-color)' }} />
                          <span className="text-[10px] font-black uppercase tracking-widest" style={{ color: 'var(--theme-color)' }}>Aktiv Agentur</span>
                        </div>
                        <button onClick={() => window.print()} className="px-3 py-1.5 rounded-xl bg-[#0a0b0e] border border-[#2a2d35] hover:border-[var(--theme-color)] text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white flex items-center gap-1.5">
                          <Icon name="printer" className="w-3 h-3" /> PDF
                        </button>
                      </div>

                      <div className="w-full h-48 md:h-64 rounded-3xl overflow-hidden mb-6 relative border border-[#1f222a] bg-[#050505] p-4 flex items-center justify-center cursor-pointer" onClick={() => setLightboxImage(agency.logoUrl)}>
                        {agency.logoUrl ? (
                          <img src={agency.logoUrl} alt="Logo" className="w-full h-full object-contain drop-shadow-2xl" />
                        ) : (
                          <Icon name="database" className="w-12 h-12 text-slate-600" />
                        )}
                        <div className="absolute bottom-4 left-4 flex items-center gap-2">
                          <Icon name="sparkles" className="w-4 h-4" style={{ color: 'var(--theme-color)' }} />
                          <span className="text-[10px] font-black uppercase tracking-widest text-white">HQ Central</span>
                        </div>
                      </div>

                      <h2 className="text-5xl font-black uppercase italic tracking-tighter bg-clip-text text-transparent bg-gradient-to-b from-white via-gray-400 to-gray-800 mb-2">
                        {agency.name}
                      </h2>
                      <p className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-6 border-b border-[#1f222a] pb-6">Officiell Presentation & Index</p>

                      <div>
                        <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2 flex items-center gap-2">
                          <Icon name="layers" className="w-3 h-3" /> Agentur Manifest
                        </h3>
                        <p className="text-sm text-gray-300 leading-relaxed font-medium italic">"{agency.description}"</p>
                      </div>

                      {allCompanyMedia.length > 0 && (
                        <div className="pt-4 border-t border-[#1f222a] mt-6">
                          <button 
                            onClick={() => setShowCompanyCollage(!showCompanyCollage)}
                            className="text-xs font-bold text-slate-300 hover:text-white transition-colors flex items-center gap-2 group cursor-pointer text-left w-full"
                          >
                            <Icon name="image" className="w-3.5 h-3.5" style={{ color: 'var(--theme-color)' }} />
                            <span className="underline decoration-slate-600 underline-offset-4 group-hover:decoration-[var(--theme-color)]">
                              {showCompanyCollage ? 'Dölj företagskollage' : `Visa företagskollage (${allCompanyMedia.length} st)`}
                            </span>
                            <span className="ml-auto">
                              <Icon name={showCompanyCollage ? "chevronUp" : "chevronDown"} className="w-3.5 h-3.5 text-slate-500" />
                            </span>
                          </button>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Right Column: Roster & Models */}
                  <div className="xl:col-span-8 flex flex-col gap-12">
                    {agency.presentationVideoUrl && (
                      <div className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] rounded-[3rem] p-4 border border-[#2a2d35] shadow-[0_20px_40px_rgba(0,0,0,0.6)]">
                        <div className="rounded-[2.5rem] overflow-hidden relative border border-[#1f222a] aspect-video">
                          <video src={agency.presentationVideoUrl} controls autoPlay loop muted playsInline className="w-full h-full object-cover" />
                          <div className="absolute top-6 left-6 flex items-center gap-2 pointer-events-none">
                            <Icon name="sparkles" className="w-4 h-4 text-[#fbbf24]" />
                            <span className="text-[10px] font-black uppercase tracking-widest text-white drop-shadow-md">Officiell Presentation</span>
                          </div>
                        </div>
                      </div>
                    )}

                    {showCompanyCollage && allCompanyMedia.length > 0 && (
                      <div className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] rounded-[3rem] p-6 md:p-8 border border-[#2a2d35] shadow-2xl">
                        <div className="flex items-center justify-between mb-6 pb-4 border-b border-[#2a2d35]">
                          <h3 className="text-xl md:text-2xl font-black uppercase italic tracking-tighter text-white flex items-center gap-2">
                            <Icon name="image" className="w-4 h-4" style={{ color: 'var(--theme-color)' }} />
                            Företagskollage // Logotyp & Affischer
                          </h3>
                          <button onClick={() => setShowCompanyCollage(false)} className="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white flex items-center gap-1 px-3 py-1.5 rounded-xl bg-[#0a0b0e] border border-[#2a2d35]">
                            <Icon name="x" className="w-3 h-3" /> Stäng
                          </button>
                        </div>
                        <SmartMediaGrid media={allCompanyMedia} onImageClick={setLightboxImage} />
                      </div>
                    )}

                    {agency.models.map((model) => (
                      <div 
                        key={model.id}
                        className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] rounded-[3rem] p-8 border border-[#2a2d35] shadow-[0_20px_40px_rgba(0,0,0,0.6)] flex flex-col gap-6 group hover:border-[var(--hover-color)] transition-all"
                        style={{ '--hover-color': model.themeColor || '#fbbf24' }}
                      >
                        <div className="border-b border-[#2a2d35] pb-6 flex items-start justify-between cursor-pointer" onClick={() => { setActiveModel(model); setActiveTab('COLLAGE'); }}>
                          <div>
                            <span className="text-[10px] font-black uppercase tracking-widest mb-2 block" style={{ color: model.themeColor || '#fbbf24' }}>DNA ID: {model.id}</span>
                            <h3 className="text-4xl font-black uppercase italic tracking-tighter text-white group-hover:text-[var(--hover-color)] transition-colors">{model.name}</h3>
                          </div>
                        </div>

                        <div className="flex flex-col md:flex-row gap-8">
                          <div className="w-full md:w-1/3 aspect-[4/5] rounded-[2rem] overflow-hidden relative border border-[#1f222a] cursor-pointer" onClick={() => { setActiveModel(model); setActiveTab('COLLAGE'); }}>
                            <img src={model.themeImageUrl} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" alt={model.name} />
                            <div className="absolute inset-0 bg-gradient-to-t from-[#050505] via-transparent to-transparent opacity-80" />
                            <div className="absolute bottom-4 left-4">
                              <span className="text-[10px] font-black uppercase tracking-widest text-white drop-shadow-md">{model.role}</span>
                            </div>
                          </div>

                          <div className="flex-1 flex flex-col justify-center">
                            <p className="text-sm text-slate-300 font-medium leading-relaxed mb-6 italic">"{model.definition}"</p>
                            <div className="mb-6">
                              <h4 className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Kärnvärden</h4>
                              <div className="flex flex-wrap gap-2">
                                {(model.coreValues || []).map(val => (
                                  <span key={val} className="px-3 py-1.5 rounded-xl bg-[#0a0b0e] border border-[#2a2d35] text-[10px] font-black uppercase tracking-widest text-gray-300">{val}</span>
                                ))}
                              </div>
                            </div>
                            <button onClick={() => { setActiveModel(model); setActiveTab('COLLAGE'); }} className="self-start mt-auto px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest border border-[#3a3f4b] bg-[#1a1c23] text-slate-300 group-hover:bg-[var(--hover-color)] group-hover:text-[#050505] group-hover:border-[var(--hover-color)] shadow-md transition-all flex items-center gap-2 cursor-pointer">
                              <Icon name="book" className="w-3 h-3" /> Granska fullständig profil
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'COLLAGE' && activeModel && (
                <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 pb-20">
                  {/* Left Column: Model Overview */}
                  <div className="xl:col-span-4 flex flex-col gap-6 xl:sticky xl:top-8 h-fit">
                    <div className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] p-8 rounded-[3rem] border border-[#2a2d35] shadow-[0_20px_40px_rgba(0,0,0,0.6)] relative overflow-hidden">
                      <div className="flex flex-wrap items-center justify-between mb-8 gap-2">
                        <div className="flex items-center gap-3">
                          <button onClick={() => setActiveTab('AGENCY')} className="w-8 h-8 rounded-full bg-[#1a1c23] border border-[#3a3f4b] flex items-center justify-center hover:bg-[#2a2d35] transition-colors cursor-pointer">
                            <Icon name="arrowLeft" className="w-4 h-4 text-slate-300" />
                          </button>
                          <div className="w-2 h-2 rounded-full animate-pulse" style={{ backgroundColor: 'var(--theme-color)' }} />
                          <span className="text-[10px] font-black uppercase tracking-widest" style={{ color: 'var(--theme-color)' }}>Aktiv Modell</span>
                        </div>
                        <button onClick={() => { setKeynoteStartSlide(0); setShowKeynote(true); }} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-[#1a1c23] border border-[var(--theme-color)] text-[var(--theme-color)] shadow-lg hover:scale-105 transition-all text-[10px] font-black uppercase tracking-widest cursor-pointer">
                          <Icon name="monitorPlay" className="w-3.5 h-3.5" /> Starta Keynote
                        </button>
                      </div>

                      <div className="w-full h-48 rounded-3xl overflow-hidden mb-6 relative border border-[#1f222a] cursor-pointer" onClick={() => setLightboxImage(activeModel.themeImageUrl)}>
                        <img src={activeModel.themeImageUrl} alt="Hero" className="w-full h-full object-cover hover:scale-105 transition-transform duration-700" />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#050505] via-transparent to-transparent opacity-80" />
                        <div className="absolute bottom-4 left-4 flex items-center gap-2">
                          <Icon name="sparkles" className="w-4 h-4" style={{ color: 'var(--theme-color)' }} />
                          <span className="text-[10px] font-black uppercase tracking-widest text-white">Huvudprofil</span>
                        </div>
                      </div>

                      <h2 className="text-6xl font-black uppercase italic tracking-tighter bg-clip-text text-transparent bg-gradient-to-b from-white via-gray-400 to-gray-800 mb-2">
                        {activeModel.name}
                      </h2>
                      <p className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-8 border-b border-[#1f222a] pb-6">
                        {activeModel.role}
                      </p>

                      <div className="space-y-6">
                        <div>
                          <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2 flex items-center gap-2">
                            <Icon name="layers" className="w-3 h-3" /> Manifest
                          </h3>
                          <p className="text-sm text-gray-300 leading-relaxed font-medium">
                            {activeModel.definition}
                          </p>
                        </div>

                        <div>
                          <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2 flex items-center gap-2">
                            <Icon name="cpu" className="w-3 h-3" /> DNA Profil
                          </h3>
                          <div className="flex flex-wrap gap-2">
                            {(activeModel.coreValues || []).map(val => (
                              <span key={val} className="px-3 py-1.5 rounded-xl bg-[#0a0b0e] border border-[#2a2d35] text-[10px] font-black uppercase tracking-widest text-gray-300">
                                {val}
                              </span>
                            ))}
                          </div>
                        </div>

                        {(activeModel.professions || []).length > 0 && (
                          <div className="pt-4 border-t border-[#1f222a]">
                            <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-4 flex items-center gap-2">
                              <Icon name="book" className="w-3 h-3" /> Innehållsförteckning (Yrken)
                            </h3>
                            <ul className="space-y-2">
                              {activeModel.professions.map((prof, idx) => (
                                <li key={prof.id}>
                                  <button onClick={() => document.getElementById(`profession-${prof.id}`)?.scrollIntoView({ behavior: 'smooth' })} className="text-sm font-medium text-slate-300 hover:text-white transition-colors flex items-center gap-2 text-left w-full cursor-pointer">
                                    <span className="text-[10px] font-black" style={{ color: 'var(--theme-color)' }}>0{idx + 1}</span> {prof.title}
                                  </button>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* Right Column: Keynote Widget, Videos & Portfolios */}
                  <div className="xl:col-span-8 flex flex-col gap-12">
                    <MiniKeynoteWidget 
                      model={activeModel} 
                      onOpenFullscreen={(startIdx = 0) => {
                        setKeynoteStartSlide(startIdx);
                        setShowKeynote(true);
                      }} 
                    />

                    {/* Showreels */}
                    {(activeModel.showreelVideoUrl || activeModel.secondaryShowreelVideoUrl) && (
                      <div className="flex flex-col gap-6">
                        {activeModel.showreelVideoUrl && (
                          <div className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] rounded-[3rem] p-4 border border-[#2a2d35] shadow-2xl">
                            <div className="rounded-[2.5rem] overflow-hidden relative border border-[#1f222a] aspect-video">
                              <video src={activeModel.showreelVideoUrl} controls autoPlay loop muted playsInline className="w-full h-full object-cover" />
                              <div className="absolute top-6 left-6 flex items-center gap-2 pointer-events-none bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10">
                                <Icon name="play" className="w-4 h-4" style={{ color: activeModel.themeColor || '#fbbf24' }} />
                                <span className="text-[10px] font-black uppercase tracking-widest text-white">Presentationsfilm 1</span>
                              </div>
                            </div>
                          </div>
                        )}

                        {activeModel.secondaryShowreelVideoUrl && (
                          <div className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] rounded-[3rem] p-4 border border-[#2a2d35] shadow-2xl">
                            <div className="rounded-[2.5rem] overflow-hidden relative border border-[#1f222a] aspect-video">
                              <video src={activeModel.secondaryShowreelVideoUrl} controls autoPlay loop muted playsInline className="w-full h-full object-cover" />
                              <div className="absolute top-6 left-6 flex items-center gap-2 pointer-events-none bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10">
                                <Icon name="play" className="w-4 h-4" style={{ color: activeModel.themeColor || '#fbbf24' }} />
                                <span className="text-[10px] font-black uppercase tracking-widest text-white">Presentationsfilm 2 (Vit Klänning / Showcase)</span>
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    )}

                    {/* Professions */}
                    {(activeModel.professions || []).map((prof, index) => (
                      <div 
                        id={`profession-${prof.id}`}
                        key={prof.id} 
                        className="bg-gradient-to-br from-[#1f222a] to-[#0f1115] rounded-[3rem] p-8 border border-[#2a2d35] shadow-[0_20px_40px_rgba(0,0,0,0.6)] flex flex-col gap-6 scroll-mt-8"
                      >
                        <div className="border-b border-[#2a2d35] pb-6 flex items-start justify-between">
                          <div>
                            <span className="text-[10px] font-black uppercase tracking-widest mb-2 block" style={{ color: 'var(--theme-color)' }}>Kollektion / Yrke 0{index + 1}</span>
                            <h3 className="text-4xl font-black uppercase italic tracking-tighter text-white">{prof.title}</h3>
                          </div>
                        </div>

                        {prof.presentationVideoUrl && (
                          <div className="rounded-[2.5rem] overflow-hidden relative border border-[#1f222a] aspect-video w-full shadow-2xl mb-2">
                            <video src={prof.presentationVideoUrl} controls autoPlay loop muted playsInline className="w-full h-full object-cover" />
                          </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 text-sm text-slate-300 font-medium leading-relaxed">
                          <div>
                            <h4 className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Beskrivning</h4>
                            <p>{prof.description}</p>
                          </div>
                          <div>
                            <h4 className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Historik & Erfarenhet</h4>
                            <p>{prof.history}</p>
                          </div>
                        </div>

                        <div className="mt-4">
                          <SmartMediaGrid media={prof.media} onImageClick={setLightboxImage} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Lightbox */}
          {lightboxImage && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-md p-4 md:p-12 cursor-pointer" onClick={() => setLightboxImage(null)}>
              <button className="absolute top-8 right-8 text-white hover:text-[var(--theme-color)] transition-colors z-50 p-2" onClick={(e) => { e.stopPropagation(); setLightboxImage(null); }}>
                <Icon name="x" className="w-8 h-8" />
              </button>
              <img src={lightboxImage} alt="Fullscreen" className="max-w-full max-h-full object-contain rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.8)]" />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
